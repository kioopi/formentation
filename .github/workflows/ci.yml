name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: mix ci
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (mise)
        uses: jdx/mise-action@v2

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run the full quality gate
        run: mix ci

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (mise)
        uses: jdx/mise-action@v2

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-

      - name: Install Playwright browser + system deps
        run: playwright install --with-deps chromium

      - name: Install dependencies
        run: mix deps.get

      - name: Run browser tests
        run: mix test.browser
