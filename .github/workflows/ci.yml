name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: mix ci
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (mise)
        uses: jdx/mise-action@v2

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run the full quality gate
        run: mix ci

  browser:
    name: browser tests
    runs-on: ubuntu-latest
    # This job gates merges as of v0.2.0. The suite's LiveSocket join is
    # CPU-sensitive (see Techdocs/Browser testing: 4/8 whole-run failures with
    # half the cores busy-looping), so a starved join is a real failure mode
    # whatever the runner size. The timeout bounds it instead of letting it
    # burn the job's full budget, and keeps a hung join recognisable rather
    # than indistinguishable from a regression.
    timeout-minutes: 15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (mise)
        uses: jdx/mise-action@v2

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-

      - name: Install Playwright browser + system deps
        run: playwright install --with-deps chromium

      - name: Install dependencies
        run: mix deps.get

      - name: Run browser tests
        run: mix test.browser
