<div class="ftn-form">
  
  <div class="ftn-field">
  <label for="asset_payload_serial_number">Serial number</label>
  <input type="text" id="asset_payload_serial_number" name="asset[payload][serial_number]" value="PX-2044" required minlength="4">
  
  
</div><div class="ftn-field">
  <label for="asset_payload_condition">Condition</label>
  <select id="asset_payload_condition" name="asset[payload][condition]" required>
  <option value=""></option>
  <option value="good">
    good
  </option><option value="worn" selected>
    worn
  </option><option value="defective">
    defective
  </option>
</select>
  
  
</div><div class="ftn-field">
  <label for="asset_payload_last_service">Last service</label>
  <input type="date" id="asset_payload_last_service" name="asset[payload][last_service]" value="2026-06-30">
  
  
</div><div class="ftn-field">
  <label for="asset_payload_operating_hours">Operating hours</label>
  <input type="text" inputmode="numeric" id="asset_payload_operating_hours" name="asset[payload][operating_hours]" value="5102">
  
  
</div><fieldset class="ftn-group">
  <legend>Electrical</legend>
  <div class="ftn-field">
  <label for="asset_payload_voltage">Voltage (V)</label>
  <input type="text" inputmode="numeric" id="asset_payload_voltage" name="asset[payload][voltage]" value="230.0">
  
  
</div><div class="ftn-field">
  
  <input type="hidden" name="asset[payload][insulation_ok]" value="false">
<input type="checkbox" id="asset_payload_insulation_ok" name="asset[payload][insulation_ok]" value="true" checked>
<label for="asset_payload_insulation_ok">Insulation test passed</label>
  
  
</div>
</fieldset><div class="ftn-field">
  <label for="asset_payload_notes">Notes</label>
  <textarea id="asset_payload_notes" name="asset[payload][notes]" aria-describedby="asset_payload_notes_help">Runs fine.</textarea>
  <p id="asset_payload_notes_help" class="ftn-help">Visible to all technicians.</p>
  
</div>
</div>
