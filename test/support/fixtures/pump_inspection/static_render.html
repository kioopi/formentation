<div class="ftn-form">
  
  <div class="ftn-field">
  <label for="ftn--asset_payload--field--control--serial_number">Serial number</label>
  <input type="text" id="ftn--asset_payload--field--control--serial_number" name="asset[payload][serial_number]" value="PX-2044" required minlength="4">
  
  
</div><div class="ftn-field">
  
  <fieldset id="ftn--asset_payload--field--container--condition" tabindex="-1" class="ftn-radio-group" role="radiogroup">
  <legend>Condition</legend>
  <div class="ftn-radio">
    <input type="radio" id="ftn--asset_payload--field--option_0--condition" name="asset[payload][condition]" value="good" required>
    <label for="ftn--asset_payload--field--option_0--condition">good</label>
  </div><div class="ftn-radio">
    <input type="radio" id="ftn--asset_payload--field--option_1--condition" name="asset[payload][condition]" value="worn" checked required>
    <label for="ftn--asset_payload--field--option_1--condition">worn</label>
  </div><div class="ftn-radio">
    <input type="radio" id="ftn--asset_payload--field--option_2--condition" name="asset[payload][condition]" value="defective" required>
    <label for="ftn--asset_payload--field--option_2--condition">defective</label>
  </div>
</fieldset>
  
  
</div><div class="ftn-field">
  <label for="ftn--asset_payload--field--control--last_service">Last service</label>
  <input type="date" id="ftn--asset_payload--field--control--last_service" name="asset[payload][last_service]" value="2026-06-30">
  
  
</div><div class="ftn-field">
  <label for="ftn--asset_payload--field--control--operating_hours">Operating hours</label>
  <input type="text" inputmode="numeric" id="ftn--asset_payload--field--control--operating_hours" name="asset[payload][operating_hours]" value="5102">
  
  
</div><fieldset id="ftn--asset_payload--group--container---2F-23electrical" class="ftn-group">
  <legend>Electrical</legend>
  <div class="ftn-field">
  <label for="ftn--asset_payload--field--control--voltage">Voltage (V)</label>
  <input type="text" inputmode="numeric" id="ftn--asset_payload--field--control--voltage" name="asset[payload][voltage]" value="230.0">
  
  
</div><div class="ftn-field">
  
  <input type="hidden" name="asset[payload][insulation_ok]" value="false">
<input type="checkbox" id="ftn--asset_payload--field--control--insulation_ok" name="asset[payload][insulation_ok]" value="true" checked>
<label for="ftn--asset_payload--field--control--insulation_ok">Insulation test passed</label>
  
  
</div>
</fieldset><div class="ftn-field">
  <label for="ftn--asset_payload--field--control--notes">Notes</label>
  <textarea id="ftn--asset_payload--field--control--notes" name="asset[payload][notes]" aria-describedby="ftn--asset_payload--field--help--notes">Runs fine.</textarea>
  <p id="ftn--asset_payload--field--help--notes" class="ftn-help">Visible to all technicians.</p>
  
</div>
</div>
